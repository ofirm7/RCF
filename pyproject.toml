[project]
name = "rcf"
version = "0.1.0"
description = "Refund Claim Finder — Automatic building fee refund eligibility detection for Israel"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rcf*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
